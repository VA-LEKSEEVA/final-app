<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Гостевая книга">
    <title>Гостевая книга</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main>
        <header class="hero">
            <p class="eyebrow">Оставьте запись</p>
            <h1>Гостевая книга</h1>
            <p>Поделитесь впечатлением или просто поздоровайтесь.</p>
        </header>

        <section class="card" aria-labelledby="form-title">
            <h2 id="form-title">Новое сообщение</h2>
            <form id="form">
                <label for="author">Имя</label>
                <input id="author" name="author" autocomplete="name" required maxlength="100">

                <label for="text">Сообщение</label>
                <textarea id="text" name="text" rows="5" required maxlength="1000"></textarea>

                <button id="submit" type="submit">Отправить</button>
                <div id="form-status" class="status" role="status" aria-live="polite"></div>
            </form>
        </section>

        <section aria-labelledby="messages-title">
            <div class="section-heading">
                <h2 id="messages-title">Последние сообщения</h2>
                <button id="refresh" class="secondary" type="button">Обновить</button>
            </div>
            <div id="list-status" class="status" role="status" aria-live="polite"></div>
            <p id="empty" class="empty" hidden>Сообщений пока нет. Будьте первым!</p>
            <ul id="messages" aria-live="polite"></ul>
        </section>
    </main>
    <script src="/static/app.js"></script>
</body>
</html>
