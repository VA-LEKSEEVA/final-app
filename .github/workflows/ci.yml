---
name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.23.x"
  GOLANGCI_LINT_VERSION: v1.62.2
  TERRAFORM_VERSION: 1.15.8
  TERRAFORM_LINUX_AMD64_SHA256: d25ce7b6902013ad905db3d2eab0be4cd905887fe88b81a6171b8d5503c31f3d
  ANSIBLE_CORE_VERSION: 2.21.2
  YC_CLI_VERSION: 1.21.0
  KUBECTL_VERSION: v1.31.5
  KUBECTL_LINUX_AMD64_SHA256: fbecbfd375b3686002c2e81d51c390172f5ffba3d6b47920d55342cb03f557af
  HELM_VERSION: v3.17.3
  HELM_LINUX_AMD64_SHA256: ee88b3c851ae6466a3de507f7be73fe94d54cbf2987cbaa3d1a3832ea331f2cd
  YQ_VERSION: v4.44.3
  YQ_LINUX_AMD64_SHA256: a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7
  IMAGE_NAME: guestbook
  REGISTRY: ghcr.io

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Static checks
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l -- .)"
          if [[ -n "$unformatted" ]]; then
            printf 'The following files are not formatted:\n%s\n' "$unformatted"
            exit 1
          fi
          go vet ./...
          go build ./...
          POSTGRES_PASSWORD=ci-only docker compose config --quiet

      - name: golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84  # v6
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: guestbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d guestbook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        env:
          DATABASE_URL: postgres://app:secret@localhost:5432/guestbook?sslmode=disable
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.out
          if-no-files-found: warn
          retention-days: 14

  validate-infra:
    name: Validate infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install Terraform
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/terraform.zip"
          curl --fail --show-error --silent --location \
            --retry 5 --retry-all-errors \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
            --output "$archive"
          echo "${TERRAFORM_LINUX_AMD64_SHA256}  $archive" |
            sha256sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP/terraform"
          echo "$RUNNER_TEMP/terraform" >> "$GITHUB_PATH"

      - name: Install validation tools
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/infra-venv"
          "$RUNNER_TEMP/infra-venv/bin/pip" install \
            --disable-pip-version-check \
            --no-input \
            "ansible-core==${ANSIBLE_CORE_VERSION}"
          echo "$RUNNER_TEMP/infra-venv/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Install Helm
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/helm.tar.gz"
          curl --fail --show-error --silent --location \
            --retry 5 --retry-all-errors \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            --output "$archive"
          echo "${HELM_LINUX_AMD64_SHA256}  $archive" |
            sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" \
            "$RUNNER_TEMP/infra-venv/bin/helm"

      - name: Validate Make, shell, Terraform, and Ansible
        run: make -C final-infra validate

      - name: Run infrastructure behavior tests
        run: make -C final-infra test

      - name: Validate production Helm chart
        run: |
          set -euo pipefail
          helm lint deploy/guestbook
          helm template guestbook-prod deploy/guestbook \
            >/dev/null

      - name: Validate pinned platform Helm charts
        run: |
          set -euo pipefail
          helm lint platform-charts/ingress-nginx
          helm template ingress-nginx \
            platform-charts/ingress-nginx \
            --namespace ingress-nginx \
            --set controller.kind=DaemonSet \
            --set controller.service.type=NodePort \
            --set controller.service.nodePorts.http=30080 \
            --set controller.service.nodePorts.https=30443 \
            --set controller.hostPort.enabled=true \
            >/dev/null

          helm lint platform-charts/kube-prometheus-stack
          helm template kps \
            platform-charts/kube-prometheus-stack \
            --namespace monitoring \
            --set grafana.enabled=true \
            --set prometheus.prometheusSpec.retention=1d \
            >/dev/null

  build-image:
    name: Build image
    runs-on: ubuntu-24.04
    needs: [lint, test, validate-infra]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Build Docker image
        run: |
          set -euo pipefail
          docker build \
            --build-arg VERSION="${GITHUB_SHA}" \
            --build-arg COMMIT="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      - name: Smoke-test image metadata
        run: |
          set -euo pipefail
          docker run --rm "${IMAGE_NAME}:${GITHUB_SHA}" -version

      - name: Export image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker save "${IMAGE_NAME}:${GITHUB_SHA}" |
            gzip -1 > /tmp/guestbook-image.tar.gz

      - name: Upload image artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: guestbook-image-${{ github.sha }}
          path: /tmp/guestbook-image.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish-image:
    name: Publish image
    runs-on: ubuntu-24.04
    needs: build-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.repository }}
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: guestbook-image-${{ github.sha }}
          path: /tmp

      - name: Load Docker image
        run: |
          set -euo pipefail
          gzip -dc /tmp/guestbook-image.tar.gz | docker load

      - name: Resolve GHCR image name
        id: image
        run: |
          set -euo pipefail
          repository="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"

      - name: Sign in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" |
            docker login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin

      - name: Tag and push Docker image
        env:
          IMAGE: ${{ steps.image.outputs.repository }}
        run: |
          set -euo pipefail
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE}:${GITHUB_SHA}"
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE}:latest"
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

  update-gitops:
    name: Update GitOps repo
    runs-on: ubuntu-24.04
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - name: Validate GitOps secrets
        id: gitops
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          GITOPS_REPO: ${{ secrets.GITOPS_REPO }}
        run: |
          set -euo pipefail
          [[ -n "$GITOPS_TOKEN" ]] || {
            echo "::error title=Missing secret::GITOPS_TOKEN is not configured"
            exit 1
          }
          [[ -n "$GITOPS_REPO" ]] || {
            echo "::error title=Missing secret::GITOPS_REPO is not configured"
            exit 1
          }
          repo="${GITOPS_REPO%.git}"
          repo="${repo#https://github.com/}"
          repo="${repo#http://github.com/}"
          repo="${repo#github.com/}"
          [[ "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo "::error title=Invalid repository::GITOPS_REPO must be owner/repo or a GitHub HTTPS URL"
            exit 1
          }
          echo "repository=$repo" >> "$GITHUB_OUTPUT"

      - name: Checkout GitOps repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: ${{ steps.gitops.outputs.repository }}
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main
          path: gitops
          fetch-depth: 1

      - name: Install yq
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location \
            --retry 5 --retry-all-errors \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            --output "$RUNNER_TEMP/yq"
          echo "${YQ_LINUX_AMD64_SHA256}  $RUNNER_TEMP/yq" |
            sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/yq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Update production image
        working-directory: gitops
        env:
          IMAGE: ${{ needs.publish-image.outputs.image }}
        run: |
          set -euo pipefail
          mapfile -d '' prod_files < <(
            find . -type f -name prod.yaml -not -path './.git/*' -print0
          )
          if (( ${#prod_files[@]} == 0 )); then
            echo "::error title=Missing manifest::prod.yaml was not found in the GitOps repository"
            exit 1
          fi
          if (( ${#prod_files[@]} > 1 )); then
            printf 'Found multiple prod.yaml files:\n'
            printf '  %s\n' "${prod_files[@]}"
            echo "::error title=Ambiguous manifest::Set an unambiguous prod.yaml location in the GitOps repository"
            exit 1
          fi

          prod_path="${prod_files[0]}"
          yq eval -e '.image | type == "!!map"' "$prod_path" >/dev/null || {
            echo "::error title=Invalid manifest::.image must be a mapping in $prod_path"
            exit 1
          }
          IMAGE="$IMAGE" TAG="$GITHUB_SHA" yq eval -i '
            .image.repository = strenv(IMAGE) |
            .image.tag = strenv(TAG) |
            .containerPort = 8080 |
            .postgresql.image = {
              "registry": "docker.io",
              "repository": "bitnamilegacy/postgresql",
              "tag": "16.4.0-debian-12-r14",
              "pullPolicy": "IfNotPresent"
            }
          ' "$prod_path"

          rm -f bootstrap/apps/guestbook.yaml
          yq eval -i 'del(.spec.sources[0].helm.parameters)' \
            bootstrap/apps/05-guestbook-prod.yaml
          APP_REPOSITORY="https://github.com/${GITHUB_REPOSITORY}.git" \
            yq eval -i '
              .spec.sources[0].repoURL = strenv(APP_REPOSITORY) |
              .spec.sources[0].path = "deploy/guestbook" |
              del(.spec.sources[0].chart)
            ' bootstrap/apps/05-guestbook-prod.yaml
          APP_REPOSITORY="https://github.com/${GITHUB_REPOSITORY}.git" \
            yq eval -i '
              .spec.source.repoURL = strenv(APP_REPOSITORY) |
              .spec.source.path = "platform-charts/ingress-nginx" |
              del(.spec.source.chart) |
              .spec.source.targetRevision = "main"
            ' bootstrap/apps/02-ingress-nginx.yaml
          APP_REPOSITORY="https://github.com/${GITHUB_REPOSITORY}.git" \
            yq eval -i '
              .spec.source.repoURL = strenv(APP_REPOSITORY) |
              .spec.source.path = "platform-charts/kube-prometheus-stack" |
              del(.spec.source.chart) |
              .spec.source.targetRevision = "main" |
              .spec.syncPolicy.syncOptions = (
                (.spec.syncPolicy.syncOptions // []) +
                ["CreateNamespace=true", "ServerSideApply=true"]
                | unique
              )
            ' bootstrap/apps/03-monitoring.yaml
          cat > manifests/cluster-issuer.yaml <<'EOF'
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: letsencrypt-prod
          spec:
            acme:
              server: https://acme-v02.api.letsencrypt.org/directory
              email: vikaalekseeva@gmail.com
              privateKeySecretRef:
                name: letsencrypt-prod-key
              solvers:
                - http01:
                    ingress:
                      class: nginx
          EOF
          python3 - <<'PY'
          from pathlib import Path

          path = Path("bootstrap/apps/03-monitoring.yaml")
          content = path.read_text()
          if "additionalDataSources:" not in content:
              marker = """        grafana:
                    enabled: true
          """
              replacement = """        grafana:
                    enabled: true
                    additionalDataSources:
                      - name: Loki
                        type: loki
                        access: proxy
                        url: http://loki.logging.svc.cluster.local:3100
          """
              if marker not in content:
                  raise SystemExit("Grafana values marker was not found")
              path.write_text(content.replace(marker, replacement))

          path = Path("bootstrap/apps/02-ingress-nginx.yaml")
          content = path.read_text()
          if "kind: DaemonSet" not in content:
              marker = """        controller:
          """
              replacement = """        controller:
                    kind: DaemonSet
          """
              if marker not in content:
                  raise SystemExit("Ingress controller values marker was not found")
              path.write_text(content.replace(marker, replacement, 1))
          PY

      - name: Commit and push
        working-directory: gitops
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if git diff --quiet; then
            echo "GitOps manifest is already up to date"
            exit 0
          fi
          git add --all
          git commit -m "Deploy guestbook ${GITHUB_SHA} [skip ci]"
          git push origin HEAD:main

  deploy-production:
    name: Deploy production infrastructure
    runs-on: ubuntu-24.04
    needs: update-gitops
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    concurrency:
      group: production-infrastructure
      cancel-in-progress: false
    environment:
      name: production
    env:
      APP_HOST: guestbook.vika-cloud.ru
      GITOPS_URL: https://github.com/VA-LEKSEEVA/final-gitops.git
      YC_CLOUD_ID: b1gnjq35rq2a7bgg2kpk
      YC_FOLDER_ID: b1gdkpkh95ntl70k003m
      KUBECONFIG: ${{ github.workspace }}/final-infra/kubeconfig
      INVENTORY: ${{ github.workspace }}/final-infra/terraform/envs/prod/inventory.ini
      WAIT_DNS_TIMEOUT: 600
      WAIT_TIMEOUT: 1800
      MIN_ARGO_APPS: 6
      AWS_REGION: ru-central1
      AWS_DEFAULT_REGION: ru-central1
      AWS_EC2_METADATA_DISABLED: "true"
      BACKUP_BUCKET: guestbook-backups-2026
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install Terraform
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/terraform.zip"
          curl --fail --show-error --silent --location \
            --retry 5 --retry-all-errors \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
            --output "$archive"
          echo "${TERRAFORM_LINUX_AMD64_SHA256}  $archive" |
            sha256sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP/terraform"
          echo "$RUNNER_TEMP/terraform" >> "$GITHUB_PATH"

      - name: Install Ansible and Yandex Cloud CLI
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/infra-venv"
          "$RUNNER_TEMP/infra-venv/bin/pip" install \
            --disable-pip-version-check \
            --no-input \
            "ansible-core==${ANSIBLE_CORE_VERSION}"
          echo "$RUNNER_TEMP/infra-venv/bin" >> "$GITHUB_PATH"
          curl --fail --show-error --silent --location \
            --retry 5 --retry-all-errors \
            https://storage.yandexcloud.net/yandexcloud-yc/install.sh \
            --output "$RUNNER_TEMP/install-yc.sh"
          CLI_VERSION="$YC_CLI_VERSION" \
            bash "$RUNNER_TEMP/install-yc.sh" -n -i "$RUNNER_TEMP/yandex-cloud"
          echo "$RUNNER_TEMP/yandex-cloud/bin" >> "$GITHUB_PATH"
          curl --fail --show-error --silent --location \
            --retry 5 --retry-all-errors \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" \
            --output "$RUNNER_TEMP/kubectl"
          echo "${KUBECTL_LINUX_AMD64_SHA256}  $RUNNER_TEMP/kubectl" |
            sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/kubectl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Authenticate to Yandex Cloud
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
        run: |
          set -euo pipefail
          YC_CONFIG_DIR="$RUNNER_TEMP/yc-config"
          YC_SERVICE_ACCOUNT_KEY_FILE="$RUNNER_TEMP/yc-sa-key.json"
          [[ -n "$YC_SA_KEY" ]] || {
            echo "::error title=Missing secret::YC_SA_KEY is required for production deployment"
            exit 1
          }
          mkdir -p "$YC_CONFIG_DIR"
          printf '%s' "$YC_SA_KEY" > "$YC_SERVICE_ACCOUNT_KEY_FILE"
          chmod 600 "$YC_SERVICE_ACCOUNT_KEY_FILE"
          yc config set service-account-key "$YC_SERVICE_ACCOUNT_KEY_FILE"
          yc config set cloud-id "$YC_CLOUD_ID"
          yc config set folder-id "$YC_FOLDER_ID"
          yc config set compute-default-zone ru-central1-a
          {
            echo "YC_CONFIG_DIR=$YC_CONFIG_DIR"
            echo "YC_SERVICE_ACCOUNT_KEY_FILE=$YC_SERVICE_ACCOUNT_KEY_FILE"
            echo "TF_VARS_FILE=$RUNNER_TEMP/production.tfvars"
          } >> "$GITHUB_ENV"
          state_passphrase="$(
            printf '%s' "$YC_SA_KEY" |
              sha256sum |
              awk '{print $1}'
          )"
          echo "::add-mask::$state_passphrase"
          echo "TF_STATE_PASSPHRASE=$state_passphrase" >> "$GITHUB_ENV"

      - name: Issue temporary Object Storage backend credentials
        run: |
          set -euo pipefail
          key_json="$(yc iam access-key issue-ephemeral \
            --session-name "github-actions-${GITHUB_RUN_ID}" \
            --duration 12h \
            --format json)"
          access_key_id="$(jq -er '.access_key_id // .access_key.key_id' <<<"$key_json")"
          secret_access_key="$(jq -er '.secret // .secret_access_key' <<<"$key_json")"
          session_token="$(jq -er '.session_token // .token' <<<"$key_json")"
          echo "::add-mask::$access_key_id"
          echo "::add-mask::$secret_access_key"
          echo "::add-mask::$session_token"
          {
            echo "AWS_ACCESS_KEY_ID=$access_key_id"
            echo "AWS_SECRET_ACCESS_KEY=$secret_access_key"
            echo "AWS_SESSION_TOKEN=$session_token"
          } >> "$GITHUB_ENV"

      - name: Restore encrypted Terraform state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          state_file="$GITHUB_WORKSPACE/final-infra/terraform/envs/prod/terraform.tfstate"
          artifacts_json="$(
            curl --fail --show-error --silent --location \
              --retry 5 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100"
          )"
          archive_url="$(
            jq -r '
              [
                .artifacts[] |
                select(.expired == false) |
                select(.name | startswith("production-terraform-state-"))
              ] |
              sort_by(.created_at) |
              last.archive_download_url // empty
            ' <<<"$artifacts_json"
          )"
          if [[ -n "$archive_url" ]]; then
            curl --fail --show-error --silent --location \
              --retry 5 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$archive_url" \
              --output "$RUNNER_TEMP/terraform-state.zip"
            unzip -q "$RUNNER_TEMP/terraform-state.zip" \
              -d "$RUNNER_TEMP/terraform-state"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in "$RUNNER_TEMP/terraform-state/terraform.tfstate.enc" \
              -out "$state_file" \
              -pass env:TF_STATE_PASSPHRASE
          fi
          echo "TF_STATE_FILE=$state_file" >> "$GITHUB_ENV"

      - name: Prepare Terraform variables
        run: |
          set -euo pipefail
          existing_folder_id="$YC_FOLDER_ID"
          existing_subnet_id=""
          existing_network_id=""
          existing_security_group_ids="[]"

          if instance_json="$(yc compute instance get k3s-master \
            --folder-id "$existing_folder_id" \
            --format json 2>/dev/null)"; then
            candidate_subnet_id="$(
              jq -r '
                .network_interfaces[0].subnet_id //
                .networkInterfaces[0].subnetId //
                empty
              ' <<<"$instance_json"
            )"
            if [[ -n "$candidate_subnet_id" ]] &&
              subnet_json="$(yc vpc subnet get "$candidate_subnet_id" \
                --folder-id "$existing_folder_id" \
                --format json 2>/dev/null)"; then
              existing_subnet_id="$candidate_subnet_id"
              existing_network_id="$(
                jq -er '.network_id // .networkId' <<<"$subnet_json"
              )"
            fi
          fi

          if [[ -z "$existing_subnet_id" ]]; then
            subnets_json="$(yc vpc subnet list \
              --folder-id "$existing_folder_id" \
              --format json)"
            matching_subnets="$(
              jq -c '
                [
                  .[] |
                  select(
                    (.zone_id // .zoneId // "") == "ru-central1-a"
                  )
                ]
              ' <<<"$subnets_json"
            )"
            subnet_count="$(jq 'length' <<<"$matching_subnets")"
            if ((subnet_count != 1)); then
              echo "::error title=Existing network discovery failed::Expected exactly one accessible subnet in the configured production folder and zone"
              exit 1
            fi
            existing_subnet_id="$(
              jq -er '.[0].id' <<<"$matching_subnets"
            )"
            existing_network_id="$(
              jq -er '.[0].network_id // .[0].networkId' \
                <<<"$matching_subnets"
            )"
          fi

          security_groups_json="$(yc vpc security-group list \
            --folder-id "$existing_folder_id" \
            --format json 2>/dev/null || printf '[]')"
          existing_security_group_ids="$(
            jq -c --arg network_id "$existing_network_id" '
              [
                .[] |
                select(
                  (.network_id // .networkId // "") == $network_id
                ) |
                .id
              ][0:1]
            ' <<<"$security_groups_json"
          )"
          echo "Using the production folder network"
          cat > "$TF_VARS_FILE" <<EOF
          cloud_id            = "$YC_CLOUD_ID"
          folder_id           = "$existing_folder_id"
          app_host            = "$APP_HOST"
          manage_dns_record   = false
          manage_backup_resources = false
          use_existing_network = true
          existing_subnet_id = "$existing_subnet_id"
          existing_security_group_ids = $existing_security_group_ids
          manage_load_balancer = false
          subnet_cidr          = "10.10.0.0/24"
          cluster_name        = "final-k3s-v2"
          ssh_user            = "ubuntu"
          ssh_private_key_path = "$RUNNER_TEMP/final-k3s-key"
          EOF

      - name: Apply Terraform infrastructure
        id: terraform
        run: |
          set -euo pipefail
          terraform_log="$RUNNER_TEMP/terraform-apply.log"
          set +e
          {
            terraform -chdir=final-infra/terraform/envs/prod init \
              -reconfigure \
              -input=false &&
            terraform -chdir=final-infra/terraform/envs/prod apply \
              -auto-approve \
              -input=false \
              -lock=false \
              -var-file="$TF_VARS_FILE"
          } >"$terraform_log" 2>&1
          terraform_status="$?"
          set -e
          echo "status=$terraform_status" >> "$GITHUB_OUTPUT"
          if ((terraform_status != 0)); then
            error_message="$(
              tail -n 25 "$terraform_log" |
                sed -E $'s/\x1b\\[[0-9;]*[mK]//g' |
                sed -E \
                  -e 's/(client-request-id|client-trace-id|RequestID|HostID)[[:space:]]*=[[:space:]]*[^ ,│]+/\1=<redacted>/g' \
                  -e 's/\\b(b1g|e9b|enp|fh8|dns|crp)[a-z0-9]{10,}\\b/<resource-id>/g' \
                  -e 's/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/<request-id>/g' |
                tr '\n' ' ' |
                cut -c1-4000
            )"
            echo "::error title=Terraform deployment failed::$error_message"
          fi

      - name: Encrypt Terraform state
        id: state
        if: always()
        run: |
          set -euo pipefail
          recovery_state="$GITHUB_WORKSPACE/final-infra/terraform/envs/prod/errored.tfstate"
          if [[ -s "$recovery_state" ]]; then
            echo "::warning title=Terraform recovery state::Using errored.tfstate produced by Terraform"
            cp "$recovery_state" "$TF_STATE_FILE"
          fi
          if [[ -s "$TF_STATE_FILE" ]]; then
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
              -in "$TF_STATE_FILE" \
              -out "$RUNNER_TEMP/terraform.tfstate.enc" \
              -pass env:TF_STATE_PASSPHRASE
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload encrypted Terraform state
        if: always() && steps.state.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: production-terraform-state-${{ github.run_id }}
          path: ${{ runner.temp }}/terraform.tfstate.enc
          if-no-files-found: error
          retention-days: 90

      - name: Stop after failed Terraform apply
        if: steps.terraform.outputs.status != '0'
        env:
          TERRAFORM_STATUS: ${{ steps.terraform.outputs.status }}
        run: exit "$TERRAFORM_STATUS"

      - name: Resolve a production hostname
        id: hostname
        run: |
          set -euo pipefail
          app_public_ip="$(terraform \
            -chdir=final-infra/terraform/envs/prod \
            output -raw app_public_ip)"
          current_ips="$(dig +short A "$APP_HOST" | sort -u)"
          if printf '%s\n' "$current_ips" | grep -Fxq "$app_public_ip"; then
            production_host="$APP_HOST"
          else
            production_host="guestbook-${app_public_ip//./-}.sslip.io"
            echo "::warning title=External DNS fallback::${APP_HOST} is managed by an external DNS provider and does not point to ${app_public_ip}; using ${production_host}"
          fi
          {
            echo "APP_HOST=$production_host"
            echo "TF_VAR_app_host=$production_host"
          } >> "$GITHUB_ENV"
          echo "host=$production_host" >> "$GITHUB_OUTPUT"
          {
            echo "### Production deployment"
            echo
            echo "- Host: https://${production_host}"
            echo "- Load balancer: ${app_public_ip}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update GitOps production hostname
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: VA-LEKSEEVA/final-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main
          path: deploy-gitops
          fetch-depth: 1

      - name: Commit production hostname to GitOps
        working-directory: deploy-gitops
        env:
          PRODUCTION_HOST: ${{ steps.hostname.outputs.host }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/infra-venv/bin/python" - <<'PY'
          import os
          from pathlib import Path
          import yaml

          path = Path("values/guestbook/prod.yaml")
          values = yaml.safe_load(path.read_text())
          values.setdefault("ingress", {})["host"] = os.environ["PRODUCTION_HOST"]
          path.write_text(yaml.safe_dump(values, sort_keys=False))
          PY
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if ! git diff --quiet; then
            git add values/guestbook/prod.yaml
            git commit -m "Set production host to ${PRODUCTION_HOST} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Wait for production DNS
        run: |
          set -euo pipefail
          make -C final-infra dns \
            TF_VARS_FILE="$TF_VARS_FILE" \
            APP_HOST="$APP_HOST"

      - name: Generate Ansible inventory
        run: |
          set -euo pipefail
          make -C final-infra inventory \
            TF_VARS_FILE="$TF_VARS_FILE"

      - name: Install k3s and bootstrap Argo CD
        run: |
          set -euo pipefail
          ansible_log="$RUNNER_TEMP/ansible-bootstrap.log"
          set +e
          ANSIBLE_NOCOLOR=1 make -C final-infra ansible \
            GITOPS_URL="$GITOPS_URL" \
            APP_HOST="$APP_HOST" \
            >"$ansible_log" 2>&1
          ansible_status="$?"
          set -e
          if ((ansible_status != 0)); then
            error_message="$(
              tail -n 40 "$ansible_log" |
                sed -E \
                  -e 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/<ip-address>/g' \
                  -e 's/\\b(b1g|e9b|enp|fh8|dns|crp)[a-z0-9]{10,}\\b/<resource-id>/g' \
                  -e 's/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/<request-id>/g' |
                tr '\n' ' ' |
                cut -c1-4000
            )"
            echo "::error title=Ansible bootstrap failed::$error_message"
            exit "$ansible_status"
          fi

      - name: Normalize exported kubeconfig endpoint
        run: |
          set -euo pipefail
          [[ -s "$KUBECONFIG" ]] || {
            echo "::error title=Missing kubeconfig::Ansible did not export a non-empty kubeconfig"
            exit 1
          }
          api_ip="$(terraform \
            -chdir=final-infra/terraform/envs/prod \
            output -raw app_public_ip)"
          API_SERVER="https://${api_ip}:6443" \
            KUBECONFIG_PATH="$KUBECONFIG" \
            "$RUNNER_TEMP/infra-venv/bin/python" - <<'PY'
          import os
          from pathlib import Path
          import yaml

          path = Path(os.environ["KUBECONFIG_PATH"])
          config = yaml.safe_load(path.read_text())
          clusters = config.get("clusters") or []
          if not clusters:
              raise SystemExit("kubeconfig does not contain clusters")
          for cluster in clusters:
              cluster.setdefault("cluster", {})["server"] = os.environ["API_SERVER"]
          path.write_text(yaml.safe_dump(config, sort_keys=False))
          path.chmod(0o600)
          PY

      - name: Wait for Kubernetes API access
        run: |
          set -euo pipefail
          command -v kubectl >/dev/null || {
            echo "::error title=kubectl unavailable::kubectl was not installed on the deployment runner"
            exit 1
          }
          [[ -s "$KUBECONFIG" ]] || {
            echo "::error title=Missing kubeconfig::Ansible did not export a non-empty kubeconfig"
            exit 1
          }
          kubectl config current-context >/dev/null || {
            echo "::error title=Invalid kubeconfig::The exported kubeconfig has no usable current context"
            exit 1
          }
          deadline=$((SECONDS + 300))
          kubectl_error="$RUNNER_TEMP/kubectl-readiness.err"
          until kubectl version --request-timeout=5s \
            >/dev/null 2>"$kubectl_error"; do
            if ((SECONDS >= deadline)); then
              error_message="$(
                tail -n 5 "$kubectl_error" |
                  sed -E \
                    -e 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/<ip-address>/g' \
                    -e 's/\\b(b1g|e9b|enp|fh8|dns|crp)[a-z0-9]{10,}\\b/<resource-id>/g' |
                  tr '\n' ' ' |
                  cut -c1-2000
              )"
              echo "::error title=Kubernetes API unavailable::$error_message"
              exit 1
            fi
            sleep 5
          done

      - name: Apply application runtime Secret
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          make -C final-infra apply-runtime-secrets

      - name: Apply backup Secret
        run: |
          set -euo pipefail
          make -C final-infra apply-backup-secret \
            TF_VARS_FILE="$TF_VARS_FILE"

      - name: Wait for Argo CD and verify production
        run: |
          set -euo pipefail
          make -C final-infra wait
          make -C final-infra verify \
            APP_HOST="$APP_HOST" \
            TF_VARS_FILE="$TF_VARS_FILE"

      - name: Verify backup
        run: make -C final-infra backup-check TF_VARS_FILE="$TF_VARS_FILE"
